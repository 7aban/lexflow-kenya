# Nginx configuration for LexFlow
# Copy to /etc/nginx/sites-available/lexflow and replace all placeholder values.

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name lexflow.example.com;

    # Let's Encrypt challenge must work over HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lexflow.example.com;

    # SSL certificate (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/lexflow.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lexflow.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Upload size limit — must match UPLOAD_BODY_LIMIT in Node config
    client_max_body_size 50m;

    # Logging
    access_log /var/log/nginx/lexflow-access.log;
    error_log /var/log/nginx/lexflow-error.log;

    # Serve React static build
    location / {
        root /var/www/lexflow/client/dist;
        try_files $uri /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Proxy API requests to Node backend
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Preserve original request info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for uploads and long operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Disable buffering for streaming responses
        proxy_buffering off;
    }

    # Health check endpoint — can be proxied or served directly
    location = /health {
        proxy_pass http://127.0.0.1:5000/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
